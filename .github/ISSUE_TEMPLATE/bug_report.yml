name: Bug report
description: Something in Leafen does not work as it should — with made-up data and the steps that make it happen again.
body:
  - type: markdown
    attributes:
      value: |
        We strongly encourage writing this report with the agent you use: paste this line to it.

        ```text
        Read https://github.com/leafen-org/leafen/blob/main/docs/bug-reports.md and write a bug report.
        ```

        Use made-up data only: no real pages, names, addresses, tokens or codes. Describe the fix you think of in words — we don't take code. Questions and ideas go to [Discussions](https://github.com/leafen-org/leafen/discussions); security weaknesses are reported [privately](https://github.com/leafen-org/leafen/security/advisories/new), never here. We can't answer every report; we fix what reproduces first.

        When Leafen's **Report issue** opened this form, it filled in only the version, the system, and the error's reference, kind and screen (never a page or an address). Nothing is sent until you submit.
  - type: input
    id: version
    attributes:
      label: Leafen version
      description: Settings › Server › Updates shows it to an administrator.
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system and install
      description: The operating system and its version, and how Leafen runs (desktop app, Docker or from source). In a browser or the phone app, which one and its version.
      placeholder: macOS 15.1 · desktop app
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Synthetic data
      description: A file with made-up content that shows the problem (attach it), or the steps that make it in a new workspace. When only real data shows the problem, its counts, kinds and structure — never its content.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered, from a known state (a new workspace, or the data above just imported), one action each.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual
      description: What you expected, and what happened instead — the exact message, and whether it happens every time.
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: The fix you think of
      description: In words — where you think it goes wrong and what should happen instead. No code, patches or diffs.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Error reference, logs and screenshots
      description: Optional. Personal data and secrets taken out. Leafen's Report issue puts the error's reference here.
