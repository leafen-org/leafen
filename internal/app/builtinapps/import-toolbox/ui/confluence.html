<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <div class="tabs" role="tablist">
      <button class="tab" id="tab-api" type="button" role="tab" aria-selected="true" aria-controls="api"></button>
      <button class="tab" id="tab-file" type="button" role="tab" aria-selected="false" aria-controls="export"></button>
    </div>
    <section class="pane" id="api" role="tabpanel" aria-labelledby="tab-api">
      <label id="site-label" for="site"></label>
      <input class="field" id="site" type="text" autocomplete="off" spellcheck="false" autocapitalize="off">
      <div class="account">
        <span id="account"></span>
        <button class="link" id="connect" type="button"></button>
      </div>
      <p id="api-lead"></p>
      <button class="choose" id="load" type="button"></button>
      <div class="choices" id="spaces" role="radiogroup" hidden></div>
    </section>
    <section class="pane" id="export" role="tabpanel" aria-labelledby="tab-file" hidden>
      <label id="pick-label" for="file"></label>
      <button class="choose" id="choose" type="button"></button>
      <input id="file" type="file" accept=".zip,application/zip" hidden>
      <p id="lead"></p>
    </section>
    <div class="summary" id="summary" hidden>
      <strong id="summary-title"></strong>
      <span id="summary-counts"></span>
      <span id="summary-again" hidden></span>
      <ul id="summary-losses"></ul>
    </div>
    <button class="go" id="go" type="button" disabled></button>
    <p class="state" id="state" role="status"></p>
  </main>
  <script type="module" src="./confluence.js"></script>
</body>
</html>
