version: '3'

# Mobile builds of the packaged client, with Wails' iOS and Android tasks
# (desktop builds are a plain `go build`, see the product README):
#   wails3 task ios:run        build and open in the iOS Simulator
#   wails3 task android:run    build and open in the Android Emulator
vars:
  APP_NAME: "Leafen"
  BIN_DIR: "bin"
  APP_ID: "org.leafen.app"

includes:
  common: ./build/Taskfile.yml
  ios: ./build/ios/Taskfile.yml
  android: ./build/android/Taskfile.yml
