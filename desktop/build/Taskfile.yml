version: '3'

# The shared tasks Wails' iOS and Android tasks call.
tasks:
  # The module's requirements are kept by hand, not tidied by a build.
  go:mod:tidy:
    internal: true
    cmds: []

  # The window shows the product's own web build, which the server embeds.
  build:frontend:
    internal: true
    run: once
    dir: ../web
    cmds:
      - npm run build
